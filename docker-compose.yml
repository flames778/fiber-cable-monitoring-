version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nni-postgres
    environment:
      POSTGRES_USER: nni_user
      POSTGRES_PASSWORD: nni_password
      POSTGRES_DB: nni_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nni_user -d nni_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nni-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nats:
    image: nats:2.10
    container_name: nni-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-m", "8222"]

volumes:
  postgres_data:
  redis_data:
